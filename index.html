* {

}

body {
    font-family: Arial, sans-serif;

    color: white;
}

/* ENCABEZADO */

header {
    min-height: 55vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 40px 20px;

    background:
    linear-gradient(#0008, #000c),

    background-size: cover;
    background-position: center;
}

.logo {
    font-size: clamp(40px, 8vw, 75px);

    letter-spacing: 3px;
}

.logo span {
    color: #d71920;
}

header p {
    font-size: 20px;
    margin-top: 15px;
}

/* NAVEGACIÓN */

nav {
    position: sticky;
    top: 0;

    background: #151515ee;

    padding: 15px;

    text-align: center;

    z-index: 10;
}

nav a {
    color: white;
    text-decoration: none;

    margin: 0 12px;

    font-weight: bold;
}

/* CONTENEDOR */

.container {
    max-width: 1150px;

}

h2 {
    text-align: center;

}

.intro {
    text-align: center;

}

/* CATEGORÍAS */

.categorias {

    padding-bottom: 20px;
}

.categorias button {
    white-space: nowrap;

    background: #252525;

    color: white;

    border: none;

    padding: 11px 16px;

    border-radius: 25px;

    cursor: pointer;
}

.categorias button.activo {
    background: #d71920;
}

/* PRODUCTOS */

.productos {
    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));

    gap: 20px;
}
.foto-plato {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 15px;
    background: #111;
}
.foto-plato {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 15px;
    background: #111;
}
.producto {
    background: #171717;

    border-radius: 16px;

    padding: 20px;

    display: flex;

    flex-direction: column;

    min-height: 240px;
}

.categoria {
    color: #e66;

    font-size: 12px;

    font-weight: bold;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.producto h3 {
    font-size: 20px;

    margin-bottom: 10px;
}

.producto p {
    color: #aaa;

    line-height: 1.5;

    flex: 1;
}

.precio {
    font-size: 21px;

    font-weight: bold;

    margin: 15px 0;
}

.agregar {
    background: #d71920;

    color: white;

    border: none;

    padding: 12px;

    border-radius: 9px;

    cursor: pointer;

    font-weight: bold;
}

/* CARRITO */

.carrito {
    margin-top: 50px;

    background: #151515;

    border: 1px solid #333;

    border-radius: 20px;

    padding: 25px;
}

.item {
    display: grid;

    grid-template-columns:
    1fr auto auto;

    gap: 15px;

    padding: 15px 0;

    border-bottom: 1px solid #292929;
}

.cantidad {
    display: flex;

    gap: 8px;

    align-items: center;
}

.cantidad button {
    width: 30px;

    height: 30px;

    border: none;

    border-radius: 50%;

    background: #292929;

    color: white;

    cursor: pointer;

    font-size: 18px;
}

.eliminar {
    background: none;

    border: none;

    color: #e66;

    cursor: pointer;
}

.resumen {
    padding-top: 20px;

    text-align: right;

    line-height: 2;
}

.total {
    font-size: 25px;

    font-weight: bold;
}

/* FORMULARIO */

.formulario {
    display: grid;

    grid-template-columns:
    1fr 1fr;

    gap: 12px;

    margin-top: 25px;
}

.formulario h3 {
    grid-column: 1 / -1;
}

.formulario input,
.formulario textarea,
.formulario select {

    padding: 13px;

    background: #0d0d0d;

    color: white;

    border: 1px solid #444;

    border-radius: 9px;
}

.formulario textarea {

    min-height: 90px;

    resize: vertical;
}

.completo {
    grid-column: 1 / -1;
}

/* WHATSAPP */

.whatsapp {

    width: 100%;

    margin-top: 20px;

    padding: 16px;

    border: none;

    border-radius: 10px;

    background: #20a34a;

    color: white;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;
}

.vacio {

    text-align: center;

    color: #999;

    padding: 25px;
}

/* PIE */

footer {

    text-align: center;

    padding: 30px;

    color: #888;

    background: #050505;
}

/* CELULAR */

@media(max-width:650px) {

    .formulario {
        grid-template-columns: 1fr;
    }

    .completo {
        grid-column: auto;
    }

    .item {
        grid-template-columns:
        1fr auto;
    }

}

</style>

precio:130900

let carrito = {};


/* DINERO */

function dinero(numero) {

return numero.toLocaleString("es-CO");

}


/* PRODUCTOS */

function mostrarProductos(lista = productos) {

const contenedor =
document.getElementById("productos");

contenedor.innerHTML = "";


lista.forEach(producto => {

contenedor.innerHTML += `

<article class="producto">
${producto.imagen ? `
<img
    class="foto-plato"
    src="${producto.imagen}"
    alt="${producto.nombre}">
` : ""}
<div class="categoria">
${producto.categoria}
</div>

<h3>
${producto.nombre}
</h3>

<p>
${producto.descripcion}
</p>

<div class="precio">
$${dinero(producto.precio)}
</div>

<button
class="agregar"
onclick="agregar(${producto.id})">

Agregar al carrito

</button>

</article>

`;

});

}


/* AGREGAR */

function agregar(id) {

if (carrito[id]) {

carrito[id]++;

} else {

carrito[id] = 1;

}

mostrarCarrito();

document
.getElementById("pedido")
.scrollIntoView({
behavior:"smooth"
});

}


/* CAMBIAR CANTIDAD */

function cambiarCantidad(id, cantidad) {

carrito[id] += cantidad;


if (carrito[id] <= 0) {

delete carrito[id];

}


mostrarCarrito();

}


/* ELIMINAR */

function eliminar(id) {

delete carrito[id];

mostrarCarrito();

}


/* CARRITO */

function mostrarCarrito() {


const contenedor =
document.getElementById("carrito");

const ids =
Object.keys(carrito);


if (ids.length === 0) {

contenedor.innerHTML = `

<div class="vacio">

Tu carrito está vacío 🍣

</div>

`;

} else {


contenedor.innerHTML = "";


ids.forEach(id => {


const producto =
productos.find(
p => p.id == id
);


const cantidad =
carrito[id];


contenedor.innerHTML += `

<div class="item">

<div>

<b>
${producto.nombre}
</b>

<br>

$${dinero(producto.precio)}

</div>


<div class="cantidad">

<button
onclick="cambiarCantidad(${producto.id}, -1)">
−
</button>

<b>
${cantidad}
</b>

<button
onclick="cambiarCantidad(${producto.id}, 1)">
+
</button>

</div>


<button
class="eliminar"
onclick="eliminar(${producto.id})">

Eliminar

</button>

</div>

`;

});

}


/* TOTAL */

let subtotal = 0;


ids.forEach(id => {

const producto =
productos.find(
p => p.id == id
);

subtotal +=
producto.precio *
carrito[id];

});


document.getElementById("subtotal")
.textContent =
dinero(subtotal);


document.getElementById("total")
.textContent =
dinero(subtotal);


document.getElementById("contador")
.textContent =
ids.reduce(
(total,id) =>
total + carrito[id],
0
);

}


/* FILTRAR */

function filtrar(categoria, boton) {


document
.querySelectorAll(".categorias button")
.forEach(b => {

b.classList.remove("activo");

});


boton.classList.add("activo");


if (categoria === "Todos") {

mostrarProductos();

} else {

mostrarProductos(
productos.filter(
p => p.categoria === categoria
)
);

}

}


/* ==========================
WHATSAPP RAITO SUSHI WOK
========================== */

function enviarWhatsApp() {


const ids =
Object.keys(carrito);


if (ids.length === 0) {

alert(
"Agrega productos al carrito."
);

return;

}


const nombre =
document
.getElementById("nombre")
.value
.trim();


const telefono =
document
.getElementById("telefono")
.value
.trim();


const direccion =
document
.getElementById("direccion")
.value
.trim();


if (
!nombre ||
!telefono ||
!direccion
) {

alert(
"Completa nombre, teléfono y dirección."
);

return;

}


const barrio =
document
.getElementById("barrio")
.value;


const pago =
document
.getElementById("pago")
.value;


const nota =
document
.getElementById("nota")
.value;


let subtotal = 0;

let lista = "";


ids.forEach(id => {


const producto =
productos.find(
p => p.id == id
);


const cantidad =
carrito[id];


subtotal +=
producto.precio *
cantidad;


lista +=
`• ${cantidad} x ${producto.nombre} - $${dinero(producto.precio * cantidad)}%0A`;

});


/*
================================
NÚMERO REAL DE RAITO SUSHI WOK
================================

+57 320 204 3997

IMPORTANTE:
WhatsApp necesita el número
sin +, espacios ni guiones.

================================
*/

const numero =
"573202043997";


const mensaje =

`Hola, Raito Sushi Wok 🍣%0A%0A` +

`*NUEVO PEDIDO*%0A%0A` +

lista +

`%0A*Subtotal:* $${dinero(subtotal)}%0A` +

`*Delivery:* por confirmar%0A%0A` +

`*Cliente:* ${encodeURIComponent(nombre)}%0A` +

`*Teléfono:* ${encodeURIComponent(telefono)}%0A` +

`*Dirección:* ${encodeURIComponent(direccion)}%0A` +

`*Barrio:* ${encodeURIComponent(barrio)}%0A` +

`*Pago:* ${encodeURIComponent(pago)}%0A` +

`*Nota:* ${encodeURIComponent(nota)}`;


window.open(

`https://wa.me/${numero}?text=${mensaje}`,

"_blank"

);

}


/* INICIAR */

mostrarProductos();

mostrarCarrito();

</script>
